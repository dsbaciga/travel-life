# Docker Compose for TrueNAS Scale - Optimized for Lower Resource Usage
#
# This configuration reduces idle resource usage by:
# 1. Using external Nominatim (public geocoding service)
# 2. Lowering memory limits for backend
# 3. Optimizing PostgreSQL settings
#
# Migrations:
#   Migrations run automatically on startup. To run them manually:
#   docker exec travel-life-backend npx prisma migrate deploy
#
# For self-hosted Nominatim option, see docker-compose.truenas.yml

version: "3.8"

services:
  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: travel-life-db
    environment:
      POSTGRES_USER: ${DB_USER:-travel_life_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      POSTGRES_DB: ${DB_NAME:-travel_life}
      PGDATA: /var/lib/postgresql/data/pgdata
      # PostgreSQL tuning for lower resource usage
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "wal_buffers=8MB"
    ports:
      - "${DB_PORT:-30603}:5432"
    volumes:
      - ${TRUENAS_DATA_PATH:-/mnt/main_pool/travel-life}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_life_user} -d ${DB_NAME:-travel_life}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Backend API
  backend:
    # Pinned release image. Override per-deploy (e.g. to roll back):
    #   APP_VERSION=v5.5.5 docker-compose -f <this file> up -d
    # or set APP_VERSION in the env file. Do not go back to :latest - deploys must be
    # reproducible, and rollback must be a matter of naming the previous tag.
    image: ghcr.io/dsbaciga/travel-life-backend:${APP_VERSION:-v6.1.7}
    container_name: travel-life-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      # NOTE: if DB_PASSWORD contains URL-reserved characters (@ : / ? # etc.)
      # it must be percent-encoded here, since this is a URL.
      DATABASE_URL: postgresql://${DB_USER:-travel_life_user}:${DB_PASSWORD:?DB_PASSWORD environment variable is required}@db:5432/${DB_NAME:-travel_life}?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET environment variable is required - generate with: openssl rand -base64 48}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET environment variable is required - generate with: openssl rand -base64 48}"

      # Use public Nominatim service instead of self-hosted
      # This dramatically reduces resource usage (no Nominatim container needed)
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}

      # Alternative geocoding services (uncomment to use):
      # NOMINATIM_URL: https://photon.komoot.io  # Photon geocoder (faster, fewer features)

      # Optional Integrations
      IMMICH_API_URL: ${IMMICH_API_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      BASE_URL: ${BASE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Saved-link email ingest. Inert unless IMAP_USER and IMAP_PASSWORD are set.
      # IMAP_PASSWORD must be a Gmail App Password, not the account password.
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_ARCHIVE_FOLDER: ${IMAP_ARCHIVE_FOLDER:-}
      IMAP_POLL_CRON: ${IMAP_POLL_CRON:-}
      IMAP_MAX_LINKS: ${IMAP_MAX_LINKS:-}
    ports:
      - "${BACKEND_PORT:-30601}:5000"
    volumes:
      - ${TRUENAS_DATA_PATH:-/mnt/main_pool/travel-life}/uploads:/app/uploads
      - ${TRUENAS_DATA_PATH:-/mnt/main_pool/travel-life}/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"     # Reduced from 1.0
          memory: 512M    # Reduced from 1G
        reservations:
          cpus: "0.1"     # Reduced from 0.25
          memory: 128M    # Reduced from 256M

  # Frontend
  frontend:
    # Pinned release image. Override per-deploy (e.g. to roll back):
    #   APP_VERSION=v5.5.5 docker-compose -f <this file> up -d
    # or set APP_VERSION in the env file. Do not go back to :latest - deploys must be
    # reproducible, and rollback must be a matter of naming the previous tag.
    image: ghcr.io/dsbaciga/travel-life-frontend:${APP_VERSION:-v6.1.7}
    container_name: travel-life-frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 5000
    ports:
      - "30600:80"
    depends_on:
      - backend
    restart: unless-stopped
    # Probe 127.0.0.1, not localhost: wget resolves localhost to ::1 first, and
    # nginx's `listen 80` binds IPv4 only, so the probe gets ECONNREFUSED and the
    # container is marked unhealthy while serving traffic perfectly well.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"    # Reduced from 0.5
          memory: 128M    # Reduced from 256M
        reservations:
          cpus: "0.05"    # Reduced from 0.1
          memory: 32M     # Reduced from 64M

# NOTE: Nominatim service is NOT included in this optimized configuration
#
# Expected idle resource usage with this configuration:
# - Backend: ~50-100MB RAM, <1% CPU
# - Frontend: ~10-20MB RAM, <1% CPU
# - Database: ~200-400MB RAM, <1% CPU
# - Total: ~300-500MB RAM, <3% CPU
#
# Tradeoffs:
# 1. Geocoding depends on external service (rate limited to 1 req/sec)
# 2. Requires internet connectivity for geocoding features
# 3. Privacy: Geocoding queries sent to external servers
#
# To use self-hosted Nominatim, see docker-compose.truenas.yml
# For optimization tips, see PERFORMANCE_OPTIMIZATION.md
