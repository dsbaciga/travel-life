/**
 * Windows-only workaround for "Filename longer than 260 characters" in the
 * native (C++) part of the Android build.
 *
 * The ninja bundled with the Android SDK's CMake 3.22.1 is 1.10.x, which cannot
 * open paths over 260 characters. React Native's generated object directories
 * exceed that on Windows no matter how short the project path is. Ninja 1.12+
 * supports long paths when Windows has LongPathsEnabled = 1.
 *
 * Usage (from mobile/android):
 *
 *   set NINJA_LONG_PATHS=C:\path\to\ninja.exe        (1.12 or newer)
 *   gradlew assembleDebug --init-script ..\scripts\windows-long-paths.init.gradle
 *
 * It is an init script rather than an edit to android/ because that folder is
 * generated by `expo prebuild` and must not be changed by hand.
 */
def ninja = System.getenv('NINJA_LONG_PATHS')

if (ninja) {
  def ninjaPath = ninja.replace('\\', '/')
  allprojects { project ->
    def configure = {
      project.android.defaultConfig.externalNativeBuild.cmake.arguments(
        "-DCMAKE_MAKE_PROGRAM=${ninjaPath}",
        '-DCMAKE_OBJECT_PATH_MAX=1024'
      )
    }
    project.plugins.withId('com.android.application', configure)
    project.plugins.withId('com.android.library', configure)
  }
}
