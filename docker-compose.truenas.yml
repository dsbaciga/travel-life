# Docker Compose for TrueNAS Scale
#
# TrueNAS Scale Deployment Instructions:
# 1. Create datasets for persistent data:
#    - /mnt/pool/travel-life/postgres
#    - /mnt/pool/travel-life/nominatim
#    - /mnt/pool/travel-life/uploads
#
# 2. Deploy using TrueNAS Scale UI or CLI:
#    docker-compose -f docker-compose.truenas.yml up -d
#
# 3. Database migrations:
#    Migrations run automatically on startup. To run them manually:
#    docker exec travel-life-backend npx prisma migrate deploy
#
# Configuration:
# - Frontend proxies /api and /uploads to backend via nginx
# - Backend URL can be customized via BACKEND_HOST and BACKEND_PORT env vars
# - Default: backend:5000 (Docker internal networking)
# - See DEPLOYMENT_TRUENAS.md for full documentation

version: "3.8"

services:
  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: travel-life-db
    environment:
      POSTGRES_USER: ${DB_USER:-travel_life_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      POSTGRES_DB: ${DB_NAME:-travel_life}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-30603}:5432"
    volumes:
      # IMPORTANT: Update TRUENAS_DATA_PATH to match your TrueNAS dataset
      - ${TRUENAS_DATA_PATH:-/mnt/main_pool/travel-life}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_life_user} -d ${DB_NAME:-travel_life}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Backend API
  backend:
    # Use pre-built image from GitHub Container Registry
    # Or build locally if you prefer
    # Pinned release image. Override per-deploy (e.g. to roll back):
    #   APP_VERSION=v5.5.5 docker-compose -f <this file> up -d
    # or set APP_VERSION in the env file. Do not go back to :latest - deploys must be
    # reproducible, and rollback must be a matter of naming the previous tag.
    image: ghcr.io/dsbaciga/travel-life-backend:${APP_VERSION:-v6.1.7}
    container_name: travel-life-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      # NOTE: if DB_PASSWORD contains URL-reserved characters (@ : / ? # etc.)
      # it must be percent-encoded here, since this is a URL.
      DATABASE_URL: postgresql://${DB_USER:-travel_life_user}:${DB_PASSWORD:?DB_PASSWORD environment variable is required}@db:5432/${DB_NAME:-travel_life}?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET environment variable is required - generate with: openssl rand -base64 48}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET environment variable is required - generate with: openssl rand -base64 48}"
      NOMINATIM_URL: ${NOMINATIM_URL:-http://nominatim:8080}
      # Optional Integrations
      IMMICH_API_URL: ${IMMICH_API_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      # REQUIRED: Set this to your frontend's public URL (the domain you access the app from)
      # Without this, browser requests from your domain will be blocked by CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      BASE_URL: ${BASE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Saved-link email ingest. Inert unless IMAP_USER and IMAP_PASSWORD are set.
      # IMAP_PASSWORD must be a Gmail App Password, not the account password.
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_ARCHIVE_FOLDER: ${IMAP_ARCHIVE_FOLDER:-}
      IMAP_POLL_CRON: ${IMAP_POLL_CRON:-}
      IMAP_MAX_LINKS: ${IMAP_MAX_LINKS:-}
    ports:
      - "${BACKEND_PORT:-30601}:5000"
    volumes:
      # IMPORTANT: Update TRUENAS_DATA_PATH to match your TrueNAS dataset
      - ${TRUENAS_DATA_PATH:-/mnt/main_pool/travel-life}/uploads:/app/uploads
      - ${TRUENAS_DATA_PATH:-/mnt/main_pool/travel-life}/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Frontend
  frontend:
    # Use pre-built image with TrueNAS-specific nginx proxy configuration
    # This allows the frontend to use relative URLs (/api, /uploads)
    # which are proxied to the backend container
    # Pinned release image. Override per-deploy (e.g. to roll back):
    #   APP_VERSION=v5.5.5 docker-compose -f <this file> up -d
    # or set APP_VERSION in the env file. Do not go back to :latest - deploys must be
    # reproducible, and rollback must be a matter of naming the previous tag.
    image: ghcr.io/dsbaciga/travel-life-frontend:${APP_VERSION:-v6.1.7}
    container_name: travel-life-frontend
    environment:
      # Backend URL for nginx proxy (default: backend:5000 for Docker internal networking)
      # Use Docker internal networking for best performance
      BACKEND_HOST: backend
      BACKEND_PORT: 5000
    ports:
      - "${FRONTEND_PORT:-30600}:80"
    depends_on:
      - backend
    restart: unless-stopped
    # Probe 127.0.0.1, not localhost: wget resolves localhost to ::1 first, and
    # nginx's `listen 80` binds IPv4 only, so the probe gets ECONNREFUSED and the
    # container is marked unhealthy while serving traffic perfectly well.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # Self-hosted Nominatim for geocoding
  # WARNING: Initial import takes 1-2 hours and requires significant resources
  # Consider using a smaller region or external Nominatim service for testing
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: travel-life-nominatim
    environment:
      # Default: US map data (~10GB download)
      # For faster setup, use a smaller region:
      # - State: https://download.geofabrik.de/north-america/us/california-latest.osm.pbf
      # - City: https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
      PBF_URL: https://download.geofabrik.de/north-america/us-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/north-america/us-updates/
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      IMPORT_GB_POSTCODES: "false"
      THREADS: "4"
    ports:
      - "${NOMINATIM_PORT:-30602}:8080"
    volumes:
      # IMPORTANT: Update TRUENAS_DATA_PATH to match your TrueNAS dataset
      - ${TRUENAS_DATA_PATH:-/mnt/main_pool/travel-life}/nominatim:/var/lib/postgresql/14/main
    shm_size: 2gb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
# NOTE: Using bind mounts instead of named volumes for TrueNAS
# This allows you to manage storage through TrueNAS datasets
# and take advantage of ZFS features (snapshots, replication, etc.)
