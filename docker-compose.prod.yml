services:
  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: travel-life-db
    environment:
      POSTGRES_USER: ${DB_USER:-travel_life_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      POSTGRES_DB: ${DB_NAME:-travel_life}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_life_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API (Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: travel-life-backend
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-5000}
      DATABASE_URL: postgresql://${DB_USER:-travel_life_user}:${DB_PASSWORD:?DB_PASSWORD environment variable is required}@db:5432/${DB_NAME:-travel_life}?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET environment variable is required - generate with: openssl rand -base64 48}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET environment variable is required - generate with: openssl rand -base64 48}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-}
      # Browser origins allowed to call the API. Only needed when the frontend is
      # served from a different origin than the API; the bundled nginx proxies
      # /api and /uploads, so same-domain deployments can leave this unset.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-strict}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-}
      NOMINATIM_URL: ${NOMINATIM_URL:-http://nominatim:8080}
      IMMICH_API_URL: ${IMMICH_API_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      OPENROUTESERVICE_URL: ${OPENROUTESERVICE_URL:-}
      BASE_URL: ${BASE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_BUTTON_TEXT: ${OIDC_BUTTON_TEXT:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
      DISABLE_PASSWORD_LOGIN: ${DISABLE_PASSWORD_LOGIN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # AI features (PDF import, suggestions). Users may also supply their own
      # key in Settings; AI_ENABLED=false turns the features off entirely.
      AI_ENABLED: ${AI_ENABLED:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-}
      BACKUP_RATE_LIMIT_MAX: ${BACKUP_RATE_LIMIT_MAX:-}
      BACKUP_RATE_LIMIT_WINDOW_MS: ${BACKUP_RATE_LIMIT_WINDOW_MS:-}
      # SMTP - instance-wide fallback for invitation mail. Users can override it
      # per-account in Settings. Invitations still work when unset; they just
      # report emailSent=false so the inviter shares the link manually.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Saved-link email ingest. Inert unless IMAP_USER and IMAP_PASSWORD are set.
      # IMAP_PASSWORD must be a Gmail App Password, not the account password.
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_ARCHIVE_FOLDER: ${IMAP_ARCHIVE_FOLDER:-}
      IMAP_POLL_CRON: ${IMAP_POLL_CRON:-}
      IMAP_MAX_LINKS: ${IMAP_MAX_LINKS:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - uploads:/app/uploads
      - blacklist_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_UPLOAD_URL: ${VITE_UPLOAD_URL:-/uploads}
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY:-}
    container_name: travel-life-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    # Probe 127.0.0.1, not localhost: wget resolves localhost to ::1 first, and
    # nginx's `listen 80` binds IPv4 only, so the probe gets ECONNREFUSED and the
    # container is marked unhealthy while serving traffic perfectly well.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Self-hosted Nominatim for geocoding
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: travel-life-nominatim
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/north-america/us-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/north-america/us-updates/}
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      IMPORT_GB_POSTCODES: "false"
    ports:
      - "${NOMINATIM_PORT:-8080}:8080"
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    shm_size: 1gb
    restart: unless-stopped

volumes:
  postgres_data:
  nominatim_data:
  uploads:
  blacklist_data:
