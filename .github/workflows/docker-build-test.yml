name: Docker Build Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test backend production build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend production build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://localhost:5000/api
            VITE_UPLOAD_URL=http://localhost:5000/uploads

      - name: Test development build
        env:
          # Dummy secrets so `docker compose config` passes the required-variable
          # checks in docker-compose.yml. These are throwaway values used only to
          # validate the compose file in CI, never for a real deployment.
          JWT_SECRET: ci-build-test-dummy-jwt-secret
          JWT_REFRESH_SECRET: ci-build-test-dummy-jwt-refresh-secret
        run: |
          docker compose build
          docker compose config

  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.component }}
          npm ci

      - name: Run linter (frontend only)
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm run lint

      # The Prisma client is generated code; the type-checks and the test suite both
      # need it to exist before they can run.
      - name: Generate Prisma client (backend only)
        if: matrix.component == 'backend'
        run: |
          cd backend
          npx prisma generate

      # The relaxed production build is what actually ships (backend/tsconfig.prod.json).
      # Some type errors only appear here, so this is a required check.
      - name: Production build (backend only)
        if: matrix.component == 'backend'
        run: |
          cd backend
          npm run build

      # Strict type-check.
      - name: Strict type-check (backend)
        if: matrix.component == 'backend'
        run: |
          cd backend
          npm run build:strict

      # frontend: `tsc -b && vite build` was verified green on 2026-07-25, so this is
      # a required check - any error here is a real regression.
      - name: Strict type-check (frontend)
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm run build:strict

      - name: Run tests (backend only)
        if: matrix.component == 'backend'
        run: |
          cd backend
          npm test

      - name: Run tests (frontend only)
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm run test:run
