# This workflow is the SINGLE publisher of Travel Life container images.
#
# release.ps1 / release.sh bump the version, verify the builds locally, commit and
# push the tag - they do NOT push images. Pushing a v* tag triggers this workflow,
# which builds and publishes to ghcr.io and creates the GitHub Release.
# Do not add a `docker push` back into the release scripts; two publishers produced
# the same release under different tag schemes (:vX.Y.Z vs :X.Y.Z).
# See docs/guides/BUILD_AND_PUSH.md.
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # These are baked into the bundle at build time and cannot be changed at
          # runtime, so the default must be correct for a real deployment. It must
          # NOT be localhost: the frontend image serves nginx, which proxies /api
          # and /uploads to the backend, so relative URLs are right for every
          # deployment. A localhost default produces a bundle whose every request
          # dies with ERR_CONNECTION_REFUSED in the user's browser.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
            VITE_UPLOAD_URL=${{ vars.VITE_UPLOAD_URL || '/uploads' }}

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Never hard-fail the release over release notes: a missing CHANGELOG.md, or a
      # version with no section in it, falls back to a generic body.
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { capture = 1; next }
              capture && (/^## \[/ || /^---[[:space:]]*$/) { exit }
              capture { print }
            ' CHANGELOG.md)
          else
            echo "::warning::CHANGELOG.md not found - using a generic release body"
          fi

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::warning::No changelog section for $VERSION - using a generic release body"
            NOTES="Release $VERSION. See the commit history for details."
          fi

          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Android companion app. Independent of the images: if this job fails the
  # images and the GitHub Release are still published, just without an APK.
  # Skipped (not failed) until the signing secrets exist - see
  # docs/guides/BUILD_AND_PUSH.md, "Android companion app".
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.gate.outputs.enabled }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Check signing secrets
        id: gate
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] \
            && [ -n "$GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android secrets are not configured - skipping the APK build"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        working-directory: mobile
        run: npm ci

      # app.json is git-ignored (it holds the Maps key); build it from the example.
      - name: Write app.json
        if: steps.gate.outputs.enabled == 'true'
        working-directory: mobile
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export APP_VERSION="${GITHUB_REF_NAME}"; fi
          node scripts/write-app-config.mjs
          echo "APK_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"

      - name: Generate the Android project
        if: steps.gate.outputs.enabled == 'true'
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        if: steps.gate.outputs.enabled == 'true'
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --console=plain

      # Gradle signs release builds with the template's public debug key. Replace
      # that signature with the real one, so only this repository can ship an
      # update that installs over an existing copy of the app.
      - name: Sign the APK
        if: steps.gate.outputs.enabled == 'true'
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/release.jks"
          APK="$RUNNER_TEMP/travel-life-${APK_VERSION}.apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK" \
            mobile/android/app/build/outputs/apk/release/app-release.apk
          rm -f "$KEYSTORE"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload the APK as a workflow artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

  attach-android:
    needs: [create-release, build-android]
    if: github.ref_type == 'tag' && needs.build-android.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Attach the APK to the GitHub Release
        run: gh release upload "$GITHUB_REF_NAME" apk/*.apk --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
