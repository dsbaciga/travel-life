server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Increase max body size for backup restore (default is 1MB)
    client_max_body_size 100M;

    # Increase timeouts for slow connections
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API requests to backend container
    # This allows the frontend to use relative URLs like /api/trips
    # Backend URL is configured via BACKEND_HOST and BACKEND_PORT env vars
    # `^~` stops nginx from evaluating the static-asset regex location below: a
    # plain prefix location loses to a matching regex, which would send every
    # proxied path ending in .js/.jpg/.png/... to the local filesystem.
    location ^~ /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for SSE/streaming responses
        proxy_buffering off;
    }

    # Proxy upload requests to backend container
    # This serves uploaded photos and other files
    # `^~` is required, not cosmetic: uploaded files are stored as .jpg (cover
    # images are always re-encoded to JPEG), so without it the regex location
    # below wins and every uploaded image 404s from the SPA root as a broken image.
    location ^~ /uploads/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache uploaded files
        proxy_cache_valid 200 1d;
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # The service worker, its registration shim and the app shell must NEVER be
    # cached immutably. They have stable filenames (no content hash), so a long
    # cache pins clients to whatever build they first loaded and no amount of
    # reloading picks up a new deploy. Exact-match (=) locations are chosen
    # before the regex block below, so these win regardless of ordering.
    # Each block repeats the security headers because add_header in a location
    # drops every header inherited from the server block.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location = /registerSW.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Content-Security-Policy for the app shell. The policy of the HTML document
        # governs everything the page loads, so it only needs to be sent here (every
        # SPA route is served from this location through try_files).
        #   script-src 'self'   no inline or third-party script: injected markup cannot run code
        #   style-src           'unsafe-inline' is needed for Leaflet and inline style attributes
        #   img-src https:      map tiles, link-preview images and Immich are on arbitrary hosts
        #   connect-src https:  geocoding and, in split deployments, an API on another origin
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Cache static assets. Safe to keep immutable: Vite content-hashes these
    # filenames, so a new build produces new names.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve index.html for all other routes (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
